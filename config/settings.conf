# Portable AVD Launcher Configuration
# All paths and defaults are self-contained

# Default Graphics Renderer
# Options: host (Host GPU), swiftshader_indirect (CPU software), angle_indirect, guest, auto, off
DEFAULT_RENDERER="host"

# Granular Hardware Defaults
DEFAULT_CORES=4
DEFAULT_RAM_MB=4096
DEFAULT_HEAP_MB=512
DEFAULT_DISK_MB=8192

# Default Architecture
DEFAULT_ARCH="x86_64"

# Default Device Profile
DEFAULT_DEVICE="pixel_6"

# File Sharing Settings
# Enable live ADB sync daemon when emulator starts
AUTO_SYNC_SHARE=true

# Remote directory on Android device for shared files
DEVICE_SHARE_DIR="/sdcard/Download/Shared"

# Enable QEMU 9p VirtFS parameter for custom kernels with 9p support
ENABLE_QEMU_VIRTFS=true
VIRTFS_MOUNT_TAG="hostshare"

# Emulator Launch Flags
# Headless mode (no GUI window)
HEADLESS=false

# Wipe user data on start (clean boot)
WIPE_DATA=false

# Cold boot (disable quick boot snapshot)
COLD_BOOT=false

# Custom Kernel Defaults (empty by default)
# Path can be relative to project root or absolute
DEFAULT_KERNEL=""
DEFAULT_KERNEL_APPEND=""
